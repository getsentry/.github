name: Issue Triage

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: GitHub issue number to triage.
        required: true
        type: number
      repository:
        description: Repository in owner/name form.
        required: true
        type: string
      target-ref:
        description: Optional target repository ref to inspect.
        required: false
        type: string
        default: ""
      automation-ref:
        description: Optional getsentry/.github ref. Defaults to the selected workflow ref.
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      issue-number:
        required: true
        type: number
      repository:
        required: true
        type: string
      target-ref:
        required: false
        type: string
        default: ""
      automation-ref:
        required: false
        type: string
        default: main
    secrets:
      FLUE_PRIVATE_KEY:
        required: true
      FLUE_OPENAI_API_KEY:
        required: true

jobs:
  triage:
    if: >-
      ${{
        inputs.repository == 'getsentry/cli' ||
        inputs.repository == 'getsentry/dotagents' ||
        inputs.repository == 'getsentry/junior' ||
        inputs.repository == 'getsentry/sentry-mcp' ||
        inputs.repository == 'getsentry/vitest-evals' ||
        inputs.repository == 'getsentry/warden'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Resolve target repository
        id: target
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_ISSUE_NUMBER: ${{ inputs['issue-number'] }}
          TARGET_REF: ${{ inputs['target-ref'] }}
          AUTOMATION_REF: ${{ inputs['automation-ref'] }}
          EXPECTED_OWNER: getsentry
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          owner="${TARGET_REPOSITORY%%/*}"
          name="${TARGET_REPOSITORY#*/}"
          if [[ "$TARGET_REPOSITORY" != */* ]] || [ -z "$owner" ] || [ -z "$name" ]; then
            echo "Invalid repository: $TARGET_REPOSITORY" >&2
            exit 2
          fi
          if [[ ! "$owner" =~ ^[A-Za-z0-9-]+$ || ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository: $TARGET_REPOSITORY" >&2
            exit 2
          fi
          owner="${owner,,}"
          name="${name,,}"
          repository="$owner/$name"
          caller_repository="${CALLER_REPOSITORY,,}"
          if [ "$owner" != "$EXPECTED_OWNER" ]; then
            echo "Repository must belong to $EXPECTED_OWNER: $TARGET_REPOSITORY" >&2
            exit 2
          fi
          if [ "$EVENT_NAME" = "workflow_call" ] && [ "$repository" != "$caller_repository" ]; then
            echo "Reusable workflow caller must target itself: $CALLER_REPOSITORY tried $TARGET_REPOSITORY" >&2
            exit 2
          fi
          if [[ ! "$TARGET_ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid issue number: $TARGET_ISSUE_NUMBER" >&2
            exit 2
          fi
          automation_ref="$AUTOMATION_REF"
          if [ -z "$automation_ref" ]; then
            automation_ref="$WORKFLOW_REF_NAME"
          fi
          if [[ ! "$TARGET_REF" =~ ^[A-Za-z0-9._/-]*$ ]]; then
            echo "Invalid target ref: $TARGET_REF" >&2
            exit 2
          fi
          if [[ ! "$automation_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid automation ref: $automation_ref" >&2
            exit 2
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "issue-number=$TARGET_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target-ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "automation-ref=$automation_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: getsentry/.github
          ref: ${{ steps.target.outputs['automation-ref'] }}
          path: automation
          persist-credentials: false

      - name: Create issue triage read token
        id: issue-triage-read-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.FLUE_CLIENT_ID }}
          private-key: ${{ secrets.FLUE_PRIVATE_KEY }}
          owner: getsentry
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-issues: read

      - name: Create issue triage write token
        id: issue-triage-write-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.FLUE_CLIENT_ID }}
          private-key: ${{ secrets.FLUE_PRIVATE_KEY }}
          owner: getsentry
          repositories: ${{ steps.target.outputs.name }}
          permission-issues: write

      - name: Checkout target repository
        if: ${{ steps.target.outputs['target-ref'] == '' }}
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.target.outputs.repository }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.issue-triage-read-token.outputs.token }}

      - name: Checkout target repository at ref
        if: ${{ steps.target.outputs['target-ref'] != '' }}
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs['target-ref'] }}
          path: target-repo
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.issue-triage-read-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: automation/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: automation/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: automation
        run: pnpm install --frozen-lockfile

      - name: Run triage agent
        working-directory: automation
        env:
          GH_TOKEN: ${{ steps.issue-triage-write-token.outputs.token }}
          FLUE_READ_GH_TOKEN: ${{ steps.issue-triage-read-token.outputs.token }}
          FLUE_OPENAI_API_KEY: ${{ secrets.FLUE_OPENAI_API_KEY }}
          FLUE_TRIAGE_MODEL: ${{ vars.FLUE_TRIAGE_MODEL }}
          FLUE_TARGET_REPO_PATH: ${{ github.workspace }}/target-repo
          ISSUE_NUMBER: ${{ steps.target.outputs['issue-number'] }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          payload="{\"issueNumber\":${ISSUE_NUMBER},\"repository\":\"${TARGET_REPOSITORY}\"}"
          pnpm run flue:issue-triage --id "issue-triage-${ISSUE_NUMBER}" --payload "$payload"
